type User {
  id: ID!
  email: String!
  username: String!
  createdAt: Time!
  updatedAt: Time!
}

extend type Query {
  users: [User!]!
  user(id: ID!): User
}

input CreateUserInput {
  email: String!
  username: String!
  password: String!
}

extend type Mutation {
  createUser(input: CreateUserInput!): User!
}
