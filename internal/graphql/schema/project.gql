type Project {
  id: ID!
  name: String!
  description: String!
  createdBy: ID!
  createdAt: Time!
  updatedAt: Time!
}

extend type Query {
  projects: [Project!]!
  project(id: ID!): Project
}

input CreateProjectInput {
  name: String!
  description: String
  createdBy: ID!
}

extend type Mutation {
  createProject(input: CreateProjectInput!): Project!
}
