services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qhira
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - qhira-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qhira"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qhira-postgres-data:
